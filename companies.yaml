# 目标公司清单 —— 直连各公司招聘系统（ATS）公开接口。
# 侧重：德国 / 欧洲 AI 与数据方向招聘活跃的公司。
#
# 加公司的方法：打开公司招聘页，看 URL 里的 slug，填到对应板块。
#   boards.greenhouse.io/XXX      -> greenhouse: XXX
#   jobs.lever.co/XXX             -> lever: XXX
#   jobs.ashbyhq.com/XXX          -> ashby: XXX
#   jobs.smartrecruiters.com/XXX  -> smartrecruiters: XXX
#   XXX.recruitee.com             -> recruitee: XXX
#   XXX.jobs.personio.de          -> personio: XXX
# 填错不会报错，只会抓不到该公司（日志里出现 404），随时可增删。

